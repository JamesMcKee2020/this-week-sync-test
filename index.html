<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>This Week - v4.2 dummy recovery prototype</title>
<style>
:root{--ink:#1d1d1f;--mut:#6e6e73;--line:#e3e3e6;--bg:#f5f5f7;--card:#fff;--acc:#0a5cff;--amber:#b86e00;--red:#c1272d;--grn:#1e7d32}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:76px}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 14px 6px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;display:inline-block}
.chip{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle;background:#fff}
.view{padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card h3{font-size:15px;margin-bottom:2px}
.tsk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:block;width:100%;text-align:left;cursor:pointer}
.tsk .t{font-size:15px}
.tsk .meta{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);background:#fafafa}
.pill.due-soon{color:var(--amber);border-color:#ecc98a;background:#fdf6e9}
.pill.due-pass{color:var(--red);border-color:#e6a3a6;background:#fdeeee}
.pill.must{color:#fff;background:var(--ink);border-color:var(--ink)}
.pill.stop{color:var(--acc);border-color:#b9d0fb;background:#eef4ff}
.pill.conflict{color:var(--red);border-color:#e6a3a6;background:#fdeeee}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 0 7px}
.notice{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.notice.warn{background:#fdf6e9;border:1px solid #ecc98a}
.notice.bad{background:#fdeeee;border:1px solid #e6a3a6}

.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-size:14.5px;cursor:pointer;margin:4px 6px 4px 0}

.btn.danger{background:#fff;color:var(--red);border-color:#e6a3a6}
.btn.small{padding:5px 10px;font-size:13px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.task-fields input{min-width:0;max-width:100%}
@media(max-width:480px){.task-fields{flex-direction:column}.task-fields>*{flex:auto;width:100%}}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:12.5px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--acc);font-weight:600}
nav .badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:none}
#sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px 14px 90px}
#sheet .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;color:var(--mut)}
.rev{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;font-size:12.5px;color:var(--mut)}
.rev li{margin-left:16px}
.cap{font-size:13px;color:var(--mut);margin:4px 0 8px}
.hidden{display:none!important}
.flash{position:sticky;top:52px;z-index:4;margin:8px 14px 0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px}
.flash:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.photo{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.rhythm .dots{letter-spacing:2px;font-size:15px}
.demo{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:14px}
li.li{margin-left:18px;font-size:14.5px;padding:3px 0}
</style>
</head>
<body>
<header><h1>This Week</h1><span class="chip" id="storeChip">on this device</span><span class="chip" id="protoChip">v4 recovery - dummy data</span></header>
<div class="flash" id="flash"></div>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
/* ==== This Week v3 prototype. Dummy data only. No network, no accounts. ==== */
/* ---- utils ---- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>localISO(new Date());
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return localISO(d);}
function weekStart(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-d.getDay());return localISO(d);} // Sunday
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function niceDay(iso){if(!iso)return'';const t=todayStr();if(iso===t)return 'today';if(iso===addDays(t,1))return 'tomorrow';
  return new Date(iso+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});}
function flash(msg){const f=$('#flash');f.textContent=msg;clearTimeout(flash._t);flash._t=setTimeout(()=>f.textContent='',4000);}
const nowISO=()=>new Date().toISOString();

/* ---- state & storage (localStorage for the prototype; production stays IndexedDB) ---- */
const LS_KEY='twV3PrototypeV1';
let state={tasks:[],photos:{}};
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){flash('Could not save: storage full or blocked.');}}
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw)state=JSON.parse(raw);}catch(e){}}

/* ---- record model: revision history + per-side change tracking ---- */
function newTask(fields){
  const t={id:uid('t'),title:'',notes:'',tags:[],col:'inbox',status:'open',
    dueDate:null,plannedDay:null,notBefore:null,mustWeekOf:null,
    sizeMin:null,effort:null,interruptible:null,dependsOn:[],
    progress:{state:'not-started',stoppingPoint:'',updatedAt:null},
    rhythm:null,source:{kind:'text',capturedAt:nowISO()},photos:[],
    doneDate:null,outcome:'',createdAt:todayStr(),rev:1,history:[],conflicts:[]};
  Object.assign(t,fields||{});
  t.history.push({id:uid('h'),at:nowISO(),side:t._side||'app',summary:'Captured',changes:{title:[null,t.title]}});
  delete t._side;
  return t;
}
/* every app-side change goes through here: rev bump + history entry */
function changeTask(t,changes,summary,side){
  const before={};
  for(const k in changes)before[k]=t[k];
  Object.assign(t,changes);
  const delta={};for(const k in changes)delta[k]=[before[k],changes[k]];
  t.rev++;t.history.push({id:uid('h'),at:nowISO(),side:side||'app',summary:summary||'Edited',changes:delta});
  persist();
}
function lastSharedIndex(inc,loc){ // last incoming history entry also present locally
  const ids=new Set(loc.history.map(h=>h.id));
  for(let i=inc.history.length-1;i>=0;i--)if(ids.has(inc.history[i].id))return i;
  return -1;
}
function fieldsChangedAfter(rec,idx){const s=new Set();for(let i=idx+1;i<rec.history.length;i++)for(const k in rec.history[i].changes)s.add(k);return s;}

/* merge one incoming record against local; returns 'added'|'updated'|'kept'|'conflict'|'same' */
function mergeRecord(incRaw){
  const inc=JSON.parse(JSON.stringify(incRaw));
  const loc=state.tasks.find(t=>t.id===inc.id);
  if(!loc){state.tasks.push(inc);return 'added';}
  if(JSON.stringify({...loc,history:[],conflicts:[]})===JSON.stringify({...inc,history:[],conflicts:[]}))return 'same';
  const base=lastSharedIndex(inc,loc);
  const incNew=inc.history.length-1-base, locNew=loc.history.length-1-base;
  if(incNew>0&&locNew===0){ // incoming strictly newer: adopt, keep local conflict list
    const conf=loc.conflicts||[];Object.keys(loc).forEach(k=>{if(k!=='conflicts')loc[k]=inc[k];});loc.conflicts=conf.concat(inc.conflicts||[]);
    return 'updated';
  }
  if(locNew>0&&incNew===0)return 'kept';
  if(locNew===0&&incNew===0)return 'same';
  // both changed since base: field-level
  const incF=fieldsChangedAfter(inc,base),locF=fieldsChangedAfter(loc,base);
  let had=false;
  for(const k of new Set([...incF,...locF])){
    if(k==='history'||k==='rev'||k==='conflicts')continue;
    const same=JSON.stringify(inc[k])===JSON.stringify(loc[k]);
    if(same)continue;
    if(incF.has(k)&&!locF.has(k)){loc[k]=inc[k];}
    else if(!incF.has(k)&&locF.has(k)){/* keep local */}
    else{ // both sides changed the same field: keep both, never silent last-write-wins
      const incLast=inc.history.filter(h=>k in h.changes).pop();
      const locLast=loc.history.filter(h=>k in h.changes).pop();
      (loc.conflicts=loc.conflicts||[]).push({id:uid('c'),field:k,
        local:{v:loc[k],at:locLast?locLast.at:null},
        incoming:{v:inc[k],at:incLast?incLast.at:null,side:incLast?incLast.side:'?'},
        detectedAt:nowISO(),resolved:false});
      had=true;
    }
  }
  // merge histories (union by id, sorted by at)
  const seen=new Set(),merged=[];
  for(const h of loc.history.concat(inc.history)){if(!seen.has(h.id)){seen.add(h.id);merged.push(h);}}
  merged.sort((a,b)=>a.at<b.at?-1:1);loc.history=merged;loc.rev=Math.max(loc.rev,inc.rev)+1;
  return had?'conflict':'updated';
}
function resolveConflict(t,c,keep){ // keep: 'local' | 'incoming'
  if(keep==='incoming')t[c.field]=c.incoming.v;
  c.resolved=true;c.resolvedAt=nowISO();c.resolution=keep==='local'?'kept device value':'took incoming value';
  t.rev++;t.history.push({id:uid('h'),at:nowISO(),side:'app',summary:'Resolved a conflict on "'+c.field+'" ('+c.resolution+')',
    changes:{[c.field]:keep==='local'?[c.incoming.v,c.local.v]:[c.local.v,c.incoming.v]}});
  persist();
}
/* ---- demo data: entirely synthetic, labelled as such ---- */
/* ---- demo data: unmistakably fictional, every record flagged as an example ---- */
function seedDemo(){
  const t=todayStr();
  const mk=o=>{const x=newTask(o);x.source={kind:'demo',capturedAt:nowISO()};return x;};
  const hall=mk({title:'Book community hall for trivia night',tags:['errands'],mustWeekOf:weekStart(t),dueDate:addDays(t,7),col:'now',sizeMin:15,effort:'low',interruptible:true,
    notes:'Example task. Ask about the projector and the deposit.'});
  const invites=mk({title:'Send trivia night invites',tags:['social'],dependsOn:[hall.id],col:'next',sizeMin:20,effort:'low',
    notes:'Example task. Waits on the hall booking.'});
  const ranger=mk({title:'Example application: urban park steward posting',tags:['job-search'],mustWeekOf:weekStart(t),dueDate:addDays(t,2),col:'now',sizeMin:30,effort:'high',interruptible:false,
    notes:'Fictional posting, standing in for a real application so the job-search section can be tried.'});
  const resume=mk({title:'Update the example resume summary',tags:['job-search'],col:'now',sizeMin:45,effort:'high',interruptible:false});
  const ladder=mk({title:'Return the ladder to neighbour Sam',tags:['errands'],notBefore:addDays(t,3),col:'inbox',sizeMin:10,effort:'low',interruptible:true});
  const gate=mk({title:'Fix the wobbly gate hinge',tags:['home-project'],col:'next',sizeMin:45,effort:'med',interruptible:false});
  const gear=mk({title:'Camping gear swap',tags:['household'],col:'inbox',sizeMin:30,effort:'low',
    notes:'Shorthand is enough: summer gear into the bins, winter bags to the front of the closet.'});
  const trail=mk({title:'Write the trail-guide intro paragraph',tags:['learning'],col:'later',sizeMin:null,effort:'high',
    notes:'Unknown total size. Next useful step only. Waiting on the map from the hiking club.'});
  const spanish=mk({title:'Spanish flashcards',tags:['learning'],col:'now',rhythm:{target:5,per:'week',doneDates:[t]},sizeMin:15,effort:'med'});
  const guitar=mk({title:'Practice guitar',tags:['music'],col:'now',rhythm:{target:3,per:'week',doneDates:[]},sizeMin:30,effort:'low',interruptible:true});
  const walk=mk({title:'Long walk',tags:['health'],col:'now',rhythm:{target:1,per:'week',doneDates:[]},sizeMin:60,effort:'low'});
  state.tasks=[hall,invites,ranger,resume,ladder,gate,gear,trail,spanish,guitar,walk];
  persist();
}
function resetAll(){localStorage.removeItem(LS_KEY);state={tasks:[],photos:{}};persist();}

/* ---- queries ---- */
const openT=()=>state.tasks.filter(t=>t.status==='open');
const byId=id=>state.tasks.find(t=>t.id===id);
const isMust=t=>t.mustWeekOf===weekStart(todayStr());
const carriedMust=t=>t.mustWeekOf&&t.mustWeekOf<weekStart(todayStr())&&t.status==='open';
const dueSoon=t=>t.dueDate&&daysBetween(todayStr(),t.dueDate)<=3;
const blocked=t=>(t.dependsOn||[]).some(id=>{const d=byId(id);return d&&d.status!=='done';});
const parked=t=>t.notBefore&&t.notBefore>todayStr();
const rhythmDoneThisWeek=t=>{if(!t.rhythm)return 0;const ws=weekStart(todayStr());return (t.rhythm.doneDates||[]).filter(d=>d>=ws).length;};
function fits(t,budget,eff,inter){
  if(t.status!=='open'||blocked(t)||parked(t))return false;
  if(budget&&(t.sizeMin==null||t.sizeMin>budget))return false;
  if(eff&&t.effort!==eff)return false;
  if(inter&&t.interruptible!==true)return false;
  return true;
}
function unknownFit(t,eff,inter){ // size unknown so cannot prove the fit
  if(t.status!=='open'||blocked(t)||parked(t)||t.sizeMin!=null)return false;
  if(eff&&t.effort!==eff)return false;
  if(inter&&t.interruptible!==true)return false;
  return true;
}
function pills(t){
  const p=[];const tdy=todayStr();
  if(t.source&&t.source.kind==='demo')p.push('<span class="pill">example</span>');
  if(t.partialImport)p.push('<span class="pill conflict">partial import - details kept as notes</span>');
  if(isMust(t))p.push('<span class="pill must">must this week</span>');
  if(t.dueDate){const d=daysBetween(tdy,t.dueDate);
    p.push('<span class="pill '+(d<0?'due-pass':d<=3?'due-soon':'')+'">due '+niceDay(t.dueDate)+(d<0?' ('+(-d)+'d over)':'')+'</span>');}
  if(t.plannedDay)p.push('<span class="pill">plan '+niceDay(t.plannedDay)+'</span>');
  if(t.notBefore&&t.notBefore>tdy)p.push('<span class="pill">after '+niceDay(t.notBefore)+'</span>');
  if(t.progress&&t.progress.state==='in-progress')p.push('<span class="pill stop">in progress</span>');
  if((t.conflicts||[]).some(c=>!c.resolved))p.push('<span class="pill conflict">needs attention</span>');
  if(blocked(t))p.push('<span class="pill">waiting on '+(t.dependsOn||[]).filter(id=>{const d=byId(id);return d&&d.status!=='done';}).map(id=>esc((byId(id)||{}).title||'?')).join(', ')+'</span>');
  if(t.sizeMin!=null)p.push('<span class="pill">'+t.sizeMin+' min</span>');
  if(t.effort)p.push('<span class="pill">'+({low:'mindless',med:'some thought',high:'deep focus'})[t.effort]+'</span>');
  (t.tags||[]).forEach(g=>p.push('<span class="pill">#'+esc(g)+'</span>'));
  return p.join(' ');
}
function taskRow(t,extra){return '<button class="tsk" data-open="'+t.id+'"><div class="t">'+esc(t.title)+'</div><div class="meta">'+pills(t)+(extra||'')+'</div></button>';}
/* ---- views ---- */
let curView='capture';
let filter={budget:0,eff:'',inter:false};

function render(){const m=$('#main');
  ({capture:vCapture,choose:vChoose,resume:vResume,board:vBoard,done:vDone,more:vMore})[curView](m);
  bindCommon(m);renderTabs();
}
function renderTabs(){const open=openT().filter(t=>(t.conflicts||[]).some(c=>!c.resolved)).length;
  const items=[['capture','Capture'],['choose','Choose'],['resume','Resume'],['board','Board'],['done','Done'],['more','More'+(open?' <span class="badge">'+open+'</span>':'')]];
  $('#tabs').innerHTML=items.map(([k,l])=>'<button class="'+(curView===k?'on':'')+'" data-tab="'+k+'">'+l+'</button>').join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>{curView=b.dataset.tab;render();window.scrollTo(0,0);});
}
function bindCommon(m){$$('[data-open]',m).forEach(b=>b.onclick=()=>openSheet(b.dataset.open));}

function vCapture(m){
  const recent=openT().filter(t=>t.col==='inbox').sort((a,b)=>b.createdAt<a.createdAt?-1:1);
  m.innerHTML='<div class="view">'
    +'<div class="card"><h3>Keep the thought</h3><div class="cap">No category, date or estimate needed. Save first; clarify only when useful.</div>'
    +'<textarea id="capText" placeholder="What\'s on your mind?"></textarea>'
    +'<div><button class="btn" id="capSave">Save</button>'
    +'<button class="btn soft" id="capPhoto">Add a photo</button>'
    +'<input type="file" id="capPhotoFile" accept="image/*" class="hidden"></div>'
    +'<label class="f">Paste a list from Notes (headings like "Errands:" become groups)</label>'
    +'<textarea id="capList" placeholder="Errands:\nReturn library books\nBuy batteries"></textarea>'
    +'<button class="btn soft" id="capListBtn">Review the list</button></div>'
    +'<h2 class="sec">Inbox - newest first</h2>'
    +(recent.length?recent.map(t=>taskRow(t)).join(''):'<div class="cap">Nothing waiting to be sorted.</div>')
    +'</div>';
  $('#capSave').onclick=()=>{const v=$('#capText').value.trim();if(!v)return flash('Nothing to save yet.');
    const t=newTask({title:v});state.tasks.unshift(t);persist();flash('Kept. Sort it when useful.');render();};
  $('#capPhoto').onclick=()=>$('#capPhotoFile').click();
  $('#capPhotoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;shrinkPhoto(f,du=>{
    const pid=uid('p');state.photos[pid]=du;
    const t=newTask({title:'',source:{kind:'photo',capturedAt:nowISO()},photos:[pid]});state.tasks.unshift(t);persist();
    openSheet(t.id);flash('Photo kept - name it when ready.');});};
  $('#capListBtn').onclick=()=>{const v=$('#capList').value.trim();if(!v)return flash('Paste a list first.');openListReview(v);};
}
function shrinkPhoto(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const max=800,sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.8));};img.src=r.result;};r.readAsDataURL(file);}
function openListReview(text){
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const rows=lines.map((l,i)=>({raw:l,heading:/:\s*$/.test(l),on:true}));
  const sh=$('#sheet'),inn=$('#sheetIn');
  function draw(){inn.innerHTML='<button class="x" id="sheetX">✕</button><h2 style="margin-bottom:6px">Review the list</h2>'
    +'<div class="cap">Tap a line to flip it between heading and task. Headings become a #group on the ticked tasks below. Untick anything already done.</div>'
    +rows.map((r,i)=>'<label style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">'
      +'<input type="checkbox" data-i="'+i+'" '+(r.on?'checked':'')+' style="width:auto">'
      +'<span style="flex:1;'+(r.heading?'font-weight:600':'')+'">'+esc(r.raw.replace(/:\s*$/,''))+'</span>'
      +'<button class="btn small soft" data-flip="'+i+'">'+(r.heading?'heading':'task')+'</button></label>').join('')
    +'<div style="margin-top:10px"><button class="btn" id="addList">Add the ticked tasks</button></div>';
    inn.querySelector('#sheetX').onclick=()=>sh.style.display='none';
    inn.querySelectorAll('[data-flip]').forEach(b=>b.onclick=e=>{e.preventDefault();rows[b.dataset.flip].heading=!rows[b.dataset.flip].heading;draw();});
    inn.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{rows[c.dataset.i].on=c.checked;});
    inn.querySelector('#addList').onclick=()=>{
      let heads=[],n=0;
      for(const r of rows){if(!r.on)continue;
        if(r.heading){heads=[r.raw.replace(/:\s*$/,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'-')];continue;}
        const tagM=[...r.raw.matchAll(/#([a-z0-9-]+)/gi)].map(x=>x[1].toLowerCase());
        const title=r.raw.replace(/#[a-z0-9-]+/gi,'').trim();
        const t=newTask({title,source:{kind:'paste',capturedAt:nowISO()},tags:[...new Set(heads.concat(tagM))]});
        state.tasks.unshift(t);n++;}
      persist();sh.style.display='none';flash(n+' kept in the inbox.');render();};
  }
  draw();sh.style.display='block';
}

function vChoose(m){
  const t=todayStr();
  const musts=openT().filter(isMust), carried=openT().filter(carriedMust);

function v2toV3(t){ // map a v2 app task onto the v3 record shape, preserving ids. Partial compatibility: unsupported cadences/courses are retained as notes, not silently treated as migrated.
  const x=newTask({title:t.title||'',notes:t.notes||'',tags:t.tags||[],col:t.col||'inbox',
    status:t.done?'done':'open',dueDate:t.dueDate||null,plannedDay:t.day||null,notBefore:t.notBefore||null,
    mustWeekOf:t.mustWeekOf||(t.mustWeek?weekStart(todayStr()):null),sizeMin:t.size==null?null:t.size,
    effort:t.effort||null,photos:t.photos||[],doneDate:t.doneDate||null,outcome:t.outcome||'',createdAt:t.created||todayStr()});
  x.id=t.id;x.source={kind:'v2-import',capturedAt:nowISO()};
  if(t.chore){
    if(t.chore.everyN===1&&t.chore.unit==='weeks'){x.rhythm={target:1,per:'week',doneDates:t.chore.lastDone?[t.chore.lastDone]:[]};}
    else{x.partialImport=true;x.notes=(x.notes?x.notes+'\n':'')+'v2 repeating cadence kept as a note, not a live schedule: every '+t.chore.everyN+' '+t.chore.unit+(t.chore.lastDone?', last done '+t.chore.lastDone:'')+'. Set a rhythm again if you still want one.';}
  }
  if(t.course){x.partialImport=true;x.notes=(x.notes?x.notes+'\n':'')+'v2 course kept as a note, not a live tracker: '+t.course.totalText+', logged '+(t.course.loggedMin||0)+' min.';}
  x.history=[{id:uid('h'),at:nowISO(),side:'app',summary:'Imported from a v2 backup'+(x.partialImport?' (partial - see notes)':''),changes:{}}];
  x.rev=1;return x;
}
function openRestoreSheet(data){
  let incoming=[],photos={};
  if(data&&data.version===3&&Array.isArray(data.tasks)){incoming=data.tasks;for(const p of data.photos||[])photos[p.id]=p.dataUrl;}
  else if(data&&Array.isArray(data.tasks)){incoming=data.tasks.map(v2toV3);for(const p of data.photos||[])photos[p.id]=p.dataUrl;} // v1/v2 backup
  else return flash('Not a backup file.');
  const sh=$('#sheet'),inn=$('#sheetIn');
  inn.innerHTML='<button class="x" id="sheetX">✕</button><h2>Restore a backup</h2>'
    +'<div class="cap">The file holds <b>'+incoming.length+'</b> records. This device holds <b>'+state.tasks.length+'</b>.</div>'
    +'<button class="btn" id="rMerge">Merge</button> <span class="cap">new and updated records come in; device-only records stay; anything both sides changed is flagged, never silently overwritten</span>'
    +'<div style="margin-top:8px"><button class="btn danger" id="rReplace">Replace this device</button> <span class="cap">wipe first, then load the file</span></div>';
  sh.style.display='block';inn.querySelector('#sheetX').onclick=()=>sh.style.display='none';
  inn.querySelector('#rMerge').onclick=()=>{
    const counts={added:0,updated:0,kept:0,conflict:0,same:0};
    for(const inc of incoming)counts[mergeRecord(inc)]++;
    const partials=incoming.filter(x=>x.partialImport).length;
    for(const pid in photos)if(!state.photos[pid])state.photos[pid]=photos[pid];
    persist();sh.style.display='none';render();
    flash('Merged: '+counts.added+' added, '+counts.updated+' updated, '+counts.conflict+' conflict'+(counts.conflict===1?'':'s')+' flagged, '+counts.same+' unchanged.'+(partials?' '+partials+' carried over partially (details kept as notes).':''));};
  inn.querySelector('#rReplace').onclick=()=>{
    state.tasks=JSON.parse(JSON.stringify(incoming));state.photos=photos;persist();sh.style.display='none';render();
    flash('This device now matches the backup.');};
}
